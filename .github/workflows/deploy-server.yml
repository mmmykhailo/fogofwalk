name: Deploy server

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never cancel one half-way: an interrupted
# release leaves the `current` symlink and the running unit out of step.
concurrency:
  group: "deploy-server"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      HEALTH_URL: ${{ vars.API_PUBLIC_URL }}/health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          # Keep in step with BUN_VERSION in server/deploy/provision.sh, so the
          # lockfile is resolved by the same version that will run it.
          bun-version: 1.3.4

      - name: Check release version
        run: |
          CLIENT_VERSION=$(bun -p "require('./package.json').version")
          SERVER_VERSION=$(bun -p "require('./server/package.json').version")
          if [ "$CLIENT_VERSION" != "$SERVER_VERSION" ]; then
            echo "Client and server versions must match ($CLIENT_VERSION != $SERVER_VERSION)." >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      # The server has never had CI. A deploy is the wrong place to find out
      # the types do not check, so gate on both before touching the VPS.
      - name: Typecheck
        working-directory: server
        run: bun run typecheck

      - name: Test
        working-directory: server
        run: bun test

      # Fail here rather than half-way through an SSH session with a confusing
      # error. Values arrive as environment variables, never interpolated into
      # the script body.
      - name: Check deploy configuration
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ADMIN_LOGINS: ${{ vars.ADMIN_LOGINS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER API_PUBLIC_URL ALLOWED_ORIGINS \
            SESSION_SECRET ADMIN_LOGINS VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repo secrets/variables:$missing" >&2
            echo "See the Deployment section of server/README.md." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Derives the public half — fails loudly if the secret is truncated,
          # in the wrong format or passphrase-protected. The fingerprint is
          # what you compare against `ssh-keygen -l -f ~deploy/.ssh/authorized_keys`
          # on the VPS when authentication is refused.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub; then
            echo "VPS_SSH_KEY is not a usable private key (truncated, or has a passphrase)." >&2
            exit 1
          fi
          echo "deploying with key:"
          ssh-keygen -l -f ~/.ssh/id_deploy.pub
          # Pinned host key rather than StrictHostKeyChecking=no — otherwise the
          # first hop of every run trusts whatever answers on that address.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host vps
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            # Without these a refused key falls through to keyboard-interactive
            # and the job reports "Permission denied, please try again" twice
            # before the real reason.
            BatchMode yes
            PreferredAuthentications publickey
          EOF
          printf '  HostName %s\n  User %s\n' "$VPS_HOST" "$VPS_USER" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

          # known_hosts is matched against the exact name ssh is given, so a
          # secret scanned from the IP does not cover the hostname (and vice
          # versa). Without this check the first SSH step just dies with
          # "Host key verification failed" and exit 255.
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "VPS_KNOWN_HOSTS has no entry for '$VPS_HOST' (the value of VPS_HOST)." >&2
            echo "Regenerate it so it covers that exact name:" >&2
            echo "  ssh-keyscan $VPS_HOST" >&2
            echo "Entries currently pinned:" >&2
            ssh-keygen -l -f ~/.ssh/known_hosts >&2 || true
            exit 1
          fi

          # One cheap round trip, so an authentication problem is reported here
          # rather than by whichever step happens to SSH first.
          if ! ssh vps true; then
            echo "Cannot authenticate as '$VPS_USER' on '$VPS_HOST'." >&2
            echo "On the VPS, check the fingerprint above appears in:" >&2
            echo "  ssh-keygen -l -f ~$VPS_USER/.ssh/authorized_keys" >&2
            echo "If it is empty, provision.sh ran without DEPLOY_SSH_KEY set." >&2
            exit 1
          fi

      # Rendered from the environment, not from ${{ }} interpolation, so no
      # secret is ever substituted into the script text itself.
      - name: Render the server environment file
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ADMIN_LOGINS: ${{ vars.ADMIN_LOGINS }}
          PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          umask 077
          # printf rather than a heredoc: a `$` or a backtick inside a secret
          # would otherwise be expanded on its way into the file.
          {
            printf 'PORT=8787\n'
            # Caddy is the only way in; the port is not exposed to the network.
            printf 'HOST=127.0.0.1\n'
            printf 'DATA_DIR=/srv/fogofwalk/data\n'
            printf 'STORE_DRIVER=sqlite-fs\n'
            printf 'ALLOWED_ORIGINS=%s\n' "$ALLOWED_ORIGINS"
            printf 'ADMIN_LOGINS=%s\n' "$ADMIN_LOGINS"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"
            printf 'GITHUB_CLIENT_ID=%s\n' "$GITHUB_OAUTH_CLIENT_ID"
            printf 'GITHUB_CLIENT_SECRET=%s\n' "$GITHUB_OAUTH_CLIENT_SECRET"
          } > server.env

      - name: Upload the environment file
        run: |
          # Over stdin: the values never appear in the remote command line, so
          # they cannot be read out of `ps` on the VPS.
          ssh vps 'umask 077 && cat > /srv/fogofwalk/server.env.tmp && mv -f /srv/fogofwalk/server.env.tmp /srv/fogofwalk/server.env' < server.env
          rm -f server.env

      - name: Upload the release
        run: |
          ssh vps "mkdir -p /srv/fogofwalk/releases/$GITHUB_SHA"
          # `shared/` ships alongside `server/` because `~shared/*` resolves to
          # ../shared through server/tsconfig.json — the same reason
          # server/Dockerfile builds from the repository root.
          rsync -az --delete --chmod=D755,F644 \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            --exclude '.tmp-test-data-*' \
            server shared \
            "vps:/srv/fogofwalk/releases/$GITHUB_SHA/"

      - name: Activate the release
        run: |
          ssh vps "bash /srv/fogofwalk/releases/$GITHUB_SHA/server/deploy/release.sh $GITHUB_SHA '$HEALTH_URL'"

      # release.sh already polled from inside the box. This one goes through
      # DNS and Caddy, so a deploy that is only reachable on loopback fails.
      - name: Verify from the outside
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q '"ok":true'; then
              echo "$HEALTH_URL is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "$HEALTH_URL did not respond healthily" >&2
          exit 1
