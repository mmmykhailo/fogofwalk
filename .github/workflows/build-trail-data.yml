name: Build trail data

on:
  pull_request:
    paths:
      - ".github/workflows/build-trail-data.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/check-trail-runtime-sources.ts"
      - "trail-data/**"
      - "e2e/fixtures/trails-v1.pmtiles"
  push:
    paths:
      - ".github/workflows/build-trail-data.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/check-trail-runtime-sources.ts"
      - "trail-data/**"
      - "e2e/fixtures/trails-v1.pmtiles"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify offline fixture
        run: |
          bun run check:trail-runtime-sources
          bun run build:trail-fixture
          bun run verify:trail-fixture
          bun test ./trail-data/test/*.test.ts

      - name: Upload verified fixture
        uses: actions/upload-artifact@v4
        with:
          name: trail-fixture-${{ github.sha }}
          path: |
            e2e/fixtures/trails-v1.pmtiles
            trail-data/fixtures/marked-routes.osm.pbf
            trail-data/fixtures/expected-z12.json
          if-no-files-found: error
          retention-days: 14
