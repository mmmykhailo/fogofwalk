name: Check client

on:
  pull_request:
    paths:
      - "app/**"
      - "shared/**"
      - ".storybook/**"
      - "vitest.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/check-client.yml"
  push:
    paths:
      - "app/**"
      - "shared/**"
      - ".storybook/**"
      - "vitest.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/check-client.yml"

permissions:
  contents: read

concurrency:
  group: check-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      - name: Bun tests
        run: bun run test

      - name: Storybook browser tests
        run: bun run test:storybook

      - name: Storybook build
        run: bun run storybook:build

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-browser-report
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**
            coverage/**
