name: Deploy client

on:
  push:
    branches: [master]
    # Deployments are releases: the release script bumps this file only after
    # preparing the matching changelog entry.
    paths:
      - "package.json"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-tag: ${{ steps.check.outputs.should-tag }}
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: package-version
        run: |
          CLIENT_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server/package.json').version")
          if [ "$CLIENT_VERSION" != "$SERVER_VERSION" ]; then
            echo "Client and server versions must match ($CLIENT_VERSION != $SERVER_VERSION)." >&2
            exit 1
          fi
          echo "version=$CLIENT_VERSION" >> "$GITHUB_OUTPUT"

      - id: latest-tag
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '')" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          LATEST_VERSION: ${{ steps.latest-tag.outputs.version }}
        run: echo "should-tag=$([ \"$PACKAGE_VERSION\" = \"$LATEST_VERSION\" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: check-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # The sync server's origin. Unset (or blank) compiles out every
          # account and sync surface — see app/lib/server/config.ts.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag:
    runs-on: ubuntu-latest
    needs: [check-version, deploy]
    if: needs.check-version.outputs.should-tag == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
