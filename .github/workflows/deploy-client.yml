name: Deploy client

on:
  push:
    branches: [master]
    # Deployments are releases: the release script bumps this file only after
    # preparing the matching changelog entry.
    paths:
      - "package.json"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-tag: ${{ steps.check.outputs.should-tag }}
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: package-version
        run: |
          CLIENT_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server/package.json').version")
          if [ "$CLIENT_VERSION" != "$SERVER_VERSION" ]; then
            echo "Client and server versions must match ($CLIENT_VERSION != $SERVER_VERSION)." >&2
            exit 1
          fi
          echo "version=$CLIENT_VERSION" >> "$GITHUB_OUTPUT"

      - id: latest-tag
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '')" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          LATEST_VERSION: ${{ steps.latest-tag.outputs.version }}
        run: echo "should-tag=$([ \"$PACKAGE_VERSION\" = \"$LATEST_VERSION\" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: check-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.4"

      - name: Check trail runtime sources
        run: bun run check:trail-runtime-sources

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preflight published trail archive
        env:
          TRAIL_ARCHIVE_URL: ${{ vars.VITE_TRAIL_ARCHIVE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${TRAIL_ARCHIVE_URL:-}" ]; then
            echo "Trail archive: disabled (schema 1)"
            exit 0
          fi

          case "$TRAIL_ARCHIVE_URL" in
            https://*) ;;
            *)
              echo "VITE_TRAIL_ARCHIVE_URL must use HTTPS in a client deployment." >&2
              exit 1
              ;;
          esac
          case "$TRAIL_ARCHIVE_URL" in
            *\?*|*\#*)
              echo "VITE_TRAIL_ARCHIVE_URL must not contain a query or fragment." >&2
              exit 1
              ;;
          esac

          authority="${TRAIL_ARCHIVE_URL#https://}"
          authority="${authority%%/*}"
          case "$authority" in
            ""|*"@"*)
              echo "VITE_TRAIL_ARCHIVE_URL must not contain credentials." >&2
              exit 1
              ;;
          esac
          filename="${TRAIL_ARCHIVE_URL##*/}"
          case "$filename" in
            *.pmtiles) ;;
            *)
              echo "VITE_TRAIL_ARCHIVE_URL must name a .pmtiles archive." >&2
              exit 1
              ;;
          esac

          echo "Trail archive origin: https://$authority"
          echo "Trail archive filename: $filename"
          echo "Trail archive schema: 1"

          head_headers="$(mktemp)"
          range_headers="$(mktemp)"
          range_body="$(mktemp)"
          trap 'rm -f "$head_headers" "$range_headers" "$range_body"' EXIT

          curl --fail --silent --show-error --max-time 20 --head \
            --dump-header "$head_headers" --output /dev/null \
            "$TRAIL_ARCHIVE_URL"
          head_status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' "$head_headers")"
          case "$head_status" in
            2??) ;;
            *)
              echo "Trail archive HEAD preflight returned HTTP $head_status." >&2
              exit 1
              ;;
          esac
          if ! grep -Eiq '^Accept-Ranges:[[:space:]]*bytes[[:space:]]*$' "$head_headers"; then
            echo "Trail archive HEAD preflight did not advertise byte ranges." >&2
            exit 1
          fi

          curl --fail --silent --show-error --max-time 20 \
            -H 'Range: bytes=0-126' \
            --dump-header "$range_headers" --output "$range_body" \
            "$TRAIL_ARCHIVE_URL"
          range_status="$(awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }' "$range_headers")"
          if [ "$range_status" != "206" ]; then
            echo "Trail archive range preflight returned HTTP $range_status, expected 206." >&2
            exit 1
          fi
          if ! grep -Eiq '^Content-Range:[[:space:]]*bytes[[:space:]]+0-126/[0-9]+[[:space:]]*$' "$range_headers"; then
            echo "Trail archive range preflight returned an invalid Content-Range." >&2
            exit 1
          fi
          range_bytes="$(wc -c < "$range_body" | tr -d '[:space:]')"
          if [ "$range_bytes" != "127" ]; then
            echo "Trail archive range preflight returned $range_bytes bytes, expected 127." >&2
            exit 1
          fi

      - name: Build
        run: bun run build
        env:
          # The sync server's origin. Unset (or blank) compiles out every
          # account and sync surface — see app/lib/server/config.ts.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TRAIL_ARCHIVE_URL: ${{ vars.VITE_TRAIL_ARCHIVE_URL }}

      - name: Check built client trail sources
        run: bun scripts/check-trail-runtime-sources.ts --root=build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag:
    runs-on: ubuntu-latest
    needs: [check-version, deploy]
    if: needs.check-version.outputs.should-tag == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
